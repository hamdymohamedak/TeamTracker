name: Build Desktop Apps

# Employee tracker + Admin desktop shell.
# - Push to main → build & upload artifacts
# - Tag v* → build, upload, and publish a GitHub Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      # Map secret presence to a non-secret env flag (secrets cannot be used in `if:`)
      HAS_CSC: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: desktop
            artifact_name: employee-mac
            codesign_id: com.teamtracker.tracker
            app_bundle: TeamTracker.app
          - app_dir: desktop-admin
            artifact_name: admin-mac
            codesign_id: com.teamtracker.admin
            app_bundle: TeamTracker Admin.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare standalone build dir
        run: |
          mkdir -p "$RUNNER_TEMP/tt-build"
          cp -R "${{ matrix.app_dir }}/." "$RUNNER_TEMP/tt-build/"
          rm -rf "$RUNNER_TEMP/tt-build/node_modules" "$RUNNER_TEMP/tt-build/release"

      - name: Install deps and build
        working-directory: ${{ runner.temp }}/tt-build
        run: |
          npm install
          npm run build

      - name: Package Mac app
        working-directory: ${{ runner.temp }}/tt-build
        run: npm run dist:mac
        env:
          # Unsigned/ad-hoc when secrets absent; real signing when CSC_* / APPLE_* set
          # Do not compare secrets in `if:` — GitHub rejects that and the workflow fails to start.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_CSC }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Ad-hoc re-sign (unsigned builds only)
        if: ${{ env.HAS_CSC != 'true' }}
        working-directory: ${{ runner.temp }}/tt-build
        run: |
          for dir in "release/mac-arm64/${{ matrix.app_bundle }}" "release/mac/${{ matrix.app_bundle }}"; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -perm +111 -path "*/Frameworks/*" -exec codesign --force --sign - {} \; 2>/dev/null || true
              find "$dir/Contents/Frameworks" -name "*.dylib" -exec codesign --force --sign - {} \; 2>/dev/null || true
              find "$dir/Contents/Frameworks" -name "*.framework" -exec codesign --force --sign - {} \; 2>/dev/null || true
              find "$dir/Contents/Frameworks" -name "*.app" -exec codesign --force --sign - {} \; 2>/dev/null || true
              codesign --force --sign - --identifier "${{ matrix.codesign_id }}" "$dir"
            fi
          done

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          shopt -s nullglob
          for f in $RUNNER_TEMP/tt-build/release/*.dmg $RUNNER_TEMP/tt-build/release/*-mac.zip; do
            cp "$f" release-out/
          done
          ls -lh release-out/ || true

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: desktop
            artifact_name: employee-windows
          - app_dir: desktop-admin
            artifact_name: admin-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare standalone build dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tt-build"
          cp -R "${{ matrix.app_dir }}/." "$RUNNER_TEMP/tt-build/"
          rm -rf "$RUNNER_TEMP/tt-build/node_modules" "$RUNNER_TEMP/tt-build/release"

      - name: Install, build, package
        shell: bash
        working-directory: ${{ runner.temp }}/tt-build
        run: |
          npm install
          npm run dist:win

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-out
          cp "$RUNNER_TEMP"/tt-build/release/*.exe release-out/ 2>/dev/null || true
          ls -lh release-out/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: desktop
            artifact_name: employee-linux
          - app_dir: desktop-admin
            artifact_name: admin-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Prepare standalone build dir
        run: |
          mkdir -p "$RUNNER_TEMP/tt-build"
          cp -R "${{ matrix.app_dir }}/." "$RUNNER_TEMP/tt-build/"
          rm -rf "$RUNNER_TEMP/tt-build/node_modules" "$RUNNER_TEMP/tt-build/release"

      - name: Install, build, package
        working-directory: ${{ runner.temp }}/tt-build
        run: |
          npm install
          npm run dist:linux

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/tt-build/release/*.AppImage "$RUNNER_TEMP"/tt-build/release/*.deb; do
            [ -f "$f" ] && cp "$f" release-out/
          done
          ls -lh release-out/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            employee-mac/*
            admin-mac/*
            employee-windows/*
            admin-windows/*
            employee-linux/*
            admin-linux/*
