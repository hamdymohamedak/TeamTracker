name: Build Desktop Apps

# Employee tracker + Admin desktop shell.
# Trigger: create/push a version tag (e.g. v0.0.1, v1.2.3)
# Builds Mac, Windows, and Linux for both desktop apps, then publishes a GitHub Release.
# Manual: Actions → Build Desktop Apps → Run workflow
#
# Signing is OPTIONAL and zero-cost by default:
#   - No secrets  → unsigned Windows + unsigned macOS (ad-hoc identity only) → release succeeds
#   - With secrets → Developer ID / Authenticode when provided (see docs/DESKTOP_SIGNING.md)
#
# macOS runners:
#   - macos-latest     → Apple Silicon (arm64) build + arch verify
#   - macos-15-intel   → Intel MacBook (x64) build + arch verify on real x86_64 hardware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: ${{ matrix.runner }}
    env:
      # Non-secret flag for `if:` (secrets cannot be used directly in if-conditions)
      HAS_CSC: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Employee tracker — Apple Silicon
          - app_dir: desktop
            artifact_name: employee-mac-arm64
            runner: macos-latest
            arch: arm64
          # Employee tracker — Intel MacBook
          - app_dir: desktop
            artifact_name: employee-mac-x64
            runner: macos-15-intel
            arch: x64
          # Admin shell — Apple Silicon
          - app_dir: desktop-admin
            artifact_name: admin-mac-arm64
            runner: macos-latest
            arch: arm64
          # Admin shell — Intel MacBook
          - app_dir: desktop-admin
            artifact_name: admin-mac-x64
            runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report runner CPU architecture
        run: |
          echo "matrix.arch=${{ matrix.arch }}"
          echo "uname -m=$(uname -m)"
          echo "runner=${{ matrix.runner }}"
          case "$(uname -m)" in
            arm64|aarch64)
              test "${{ matrix.arch }}" = "arm64" || { echo "Runner is Apple Silicon but job expected ${{ matrix.arch }}"; exit 1; }
              ;;
            x86_64|amd64)
              test "${{ matrix.arch }}" = "x64" || { echo "Runner is Intel but job expected ${{ matrix.arch }}"; exit 1; }
              ;;
            *)
              echo "Unexpected runner arch: $(uname -m)"; exit 1
              ;;
          esac

      - name: Prepare standalone build dir
        run: |
          mkdir -p "$RUNNER_TEMP/tt-build"
          cp -R "${{ matrix.app_dir }}/." "$RUNNER_TEMP/tt-build/"
          rm -rf "$RUNNER_TEMP/tt-build/node_modules" "$RUNNER_TEMP/tt-build/release"

      - name: Install deps and build
        working-directory: ${{ runner.temp }}/tt-build
        env:
          # Bake production dashboard URL into employee tracker (desktop only).
          TEAMTRACKER_SERVER_URL: https://tracker.hostly-eg.com
        run: |
          npm install
          npm run build

      - name: Package Mac app (${{ matrix.arch }})
        working-directory: ${{ runner.temp }}/tt-build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Empty CSC_LINK makes electron-builder treat "" as a cert file path → "not a file".
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No Apple signing secrets — building unsigned macOS packages."
            echo "afterPack will ad-hoc sign for a stable bundle identity (not Gatekeeper trust)."
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            echo "CSC_LINK present — Developer ID signing enabled."
            # Incomplete notarization secrets must not fail the build.
            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
              echo "Apple notarization secrets incomplete — signing without notarization."
            else
              echo "Apple notarization secrets present (enable notarize in package.json when ready)."
            fi
          fi
          # Native-arch only: Intel job → x64, Apple Silicon → arm64.
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify packaged binary architecture
        working-directory: ${{ runner.temp }}/tt-build
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            apps=(release/mac-arm64/*.app)
            expect="arm64"
          else
            apps=(release/mac/*.app)
            expect="x86_64"
          fi
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No .app found for arch ${{ matrix.arch }}"
            ls -laR release || true
            exit 1
          fi
          app="${apps[0]}"
          bin=$(find "$app/Contents/MacOS" -type f | head -1)
          echo "Checking: $bin"
          file "$bin"
          file "$bin" | grep -q "$expect"
          echo "OK: binary matches expected arch ($expect) on runner $(uname -m)"

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/tt-build/release/*-${{ matrix.arch }}.dmg \
                   "$RUNNER_TEMP"/tt-build/release/*-${{ matrix.arch }}.zip; do
            [ -f "$f" ] && cp "$f" release-out/
          done
          if [ -z "$(ls -A release-out 2>/dev/null || true)" ]; then
            for f in "$RUNNER_TEMP"/tt-build/release/*.dmg "$RUNNER_TEMP"/tt-build/release/*.zip; do
              [ -f "$f" ] && cp "$f" release-out/
            done
          fi
          ls -lh release-out/ || true
          test -n "$(ls -A release-out 2>/dev/null || true)"

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: desktop
            artifact_name: employee-windows
          - app_dir: desktop-admin
            artifact_name: admin-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare standalone build dir
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tt-build"
          cp -R "${{ matrix.app_dir }}/." "$RUNNER_TEMP/tt-build/"
          rm -rf "$RUNNER_TEMP/tt-build/node_modules" "$RUNNER_TEMP/tt-build/release"

      - name: Install, build, package
        shell: bash
        working-directory: ${{ runner.temp }}/tt-build
        env:
          # Bake production dashboard URL into employee tracker (desktop only).
          TEAMTRACKER_SERVER_URL: https://tracker.hostly-eg.com
          # Windows Authenticode only — do not reuse Mac CSC_LINK (.p12)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Empty values make electron-builder treat "" as a cert file path → "not a file".
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
            echo "No WIN_CSC_LINK secret — building unsigned Windows installers."
          else
            echo "WIN_CSC_LINK present — Authenticode signing enabled."
          fi
          npm install
          npm run dist:win

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-out
          cp "$RUNNER_TEMP"/tt-build/release/*.exe release-out/ 2>/dev/null || true
          ls -lh release-out/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: desktop
            artifact_name: employee-linux
          - app_dir: desktop-admin
            artifact_name: admin-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Prepare standalone build dir
        run: |
          mkdir -p "$RUNNER_TEMP/tt-build"
          cp -R "${{ matrix.app_dir }}/." "$RUNNER_TEMP/tt-build/"
          rm -rf "$RUNNER_TEMP/tt-build/node_modules" "$RUNNER_TEMP/tt-build/release"

      - name: Install, build, package
        working-directory: ${{ runner.temp }}/tt-build
        env:
          # Bake production dashboard URL into employee tracker (desktop only).
          TEAMTRACKER_SERVER_URL: https://tracker.hostly-eg.com
        run: |
          npm install
          npm run dist:linux

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/tt-build/release/*.AppImage "$RUNNER_TEMP"/tt-build/release/*.deb; do
            [ -f "$f" ] && cp "$f" release-out/
          done
          ls -lh release-out/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # softprops/action-gh-release uploads all assets in parallel by default.
      # Parallel uploads of many ~100MB installers often hit GitHub's uploads API
      # with HTTP 500 "Error saving asset". Upload sequentially with retries instead.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${{ github.ref_name }}"

          files=(
            employee-mac-arm64/*
            employee-mac-x64/*
            admin-mac-arm64/*
            admin-mac-x64/*
            employee-windows/*
            admin-windows/*
            employee-linux/*
            admin-linux/*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found"
            find . -maxdepth 3 -type f | head -100 || true
            exit 1
          fi

          echo "Assets to upload (${#files[@]}):"
          printf '  %s\n' "${files[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/overwriting assets"
          else
            gh release create "$TAG" --generate-notes --draft
          fi

          for f in "${files[@]}"; do
            echo "⬆️  Uploading $f ..."
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1
                break
              fi
              sleep_s=$((attempt * 10))
              echo "Upload failed for $f (attempt $attempt/5), retrying in ${sleep_s}s..."
              sleep "$sleep_s"
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed to upload $f after 5 attempts"
              exit 1
            fi
          done

          gh release edit "$TAG" --draft=false
          echo "✅ Release $TAG published"
          gh release view "$TAG" --json url,assets --jq '{url, assets: [.assets[].name]}'
