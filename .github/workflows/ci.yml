name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm run typecheck

      - name: Unit / security tests
        run: pnpm test

      - name: Build admin (server + client)
        run: pnpm run build
        env:
          NODE_ENV: production

  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck shared package
        run: |
          if [ -f tsconfig.json ]; then
            # Use the real TypeScript compiler (not the abandoned npm package named "tsc")
            npx --yes -p typescript@5.9.3 tsc --noEmit -p tsconfig.json
          else
            echo "no tsconfig"
          fi
