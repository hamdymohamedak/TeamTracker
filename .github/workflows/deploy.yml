name: Deploy TeamTracker

on:
  push:
    branches:
      - main

concurrency:
  group: teamtracker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add secrets under Settings → Secrets and variables → Actions."
            echo "DEPLOY_SSH_KEY = private key whose public key is in VPS ~/.ssh/authorized_keys"
            echo "GitHub Deploy keys (read-only) are only for the VPS to git pull — not for Actions→VPS SSH."
            exit 1
          fi

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          KEY_FILE="$HOME/.ssh/id_ed25519"

          # Normalize key: handle secrets pasted with literal \n
          printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//' > "$KEY_FILE"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$KEY_FILE"; then
            python3 -c "
          from pathlib import Path
          p = Path.home() / '.ssh' / 'id_ed25519'
          t = p.read_text()
          if r'\\n' in t:
              p.write_text(bytes(t, 'utf-8').decode('unicode_escape'))
          "
          fi
          chmod 600 "$KEY_FILE"

          if ! grep -q 'BEGIN .*PRIVATE KEY' "$KEY_FILE"; then
            echo "::error::DEPLOY_SSH_KEY does not look like a PEM private key."
            exit 1
          fi

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          ssh-add "$KEY_FILE"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        shell: bash
        run: |
          set -euo pipefail

          echo "Connecting as ${DEPLOY_USER}@${DEPLOY_HOST} …"

          if ! ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'echo connected && whoami && hostname'; then
            echo "::error::SSH to ${DEPLOY_USER}@${DEPLOY_HOST} failed (Permission denied)."
            echo "On the VPS, ensure the matching public key is in authorized_keys for ${DEPLOY_USER}."
            echo "Put that key's PRIVATE half in Actions secret DEPLOY_SSH_KEY."
            echo "Repo Settings → Deploy keys is unrelated (used by the server to git pull)."
            exit 255
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE'
set -euo pipefail
maybe_sudo() {
  if sudo -n true 2>/dev/null; then sudo "$@"; else "$@"; fi
}
APP_DIR=""
for candidate in \
  /opt/teamtracker/application \
  /opt/teamtracker/teamtracker \
  /opt/teamtracker
do
  if [ -d "$candidate/.git" ] && [ -d "$candidate/admin" ]; then
    APP_DIR="$candidate"
    break
  fi
done
if [ -z "$APP_DIR" ]; then
  echo "No TeamTracker checkout under /opt/teamtracker — finish first install on the VPS"
  exit 1
fi
echo "Syncing $APP_DIR to origin/main before deploy..."
maybe_sudo git -C "$APP_DIR" fetch origin main
maybe_sudo git -C "$APP_DIR" checkout -B main origin/main
maybe_sudo git -C "$APP_DIR" reset --hard origin/main
maybe_sudo git -C "$APP_DIR" clean -fd -e .env -e admin/.env
for candidate in \
  "$APP_DIR/deploy-enterprise.sh" \
  "$APP_DIR/deploy.sh"
do
  if [ -f "$candidate" ]; then
    chmod +x "$candidate" 2>/dev/null || true
    echo "Running $candidate"
    maybe_sudo "$candidate"
    exit 0
  fi
done
echo "No deploy script in $APP_DIR"
exit 1
REMOTE
